name: Deploy to VPS

on:
  push:
    branches:
      - main # или master, в зависимости от вашей ветки

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd lEarNing/
            git pull
            docker compose up -d --build
